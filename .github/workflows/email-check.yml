# Temporary: finds out why password-reset emails fail. Runs only on pushes to this branch.
# The repository is public, so it prints no addresses, IPs or secrets.
name: Email check

on:
  push:
    branches: [claude/email-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The mailbox settings' shape (sends nothing)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 - <<'PY'
          import os
          u, p = os.environ["SMTP_USER"], os.environ["SMTP_PASS"]
          print(f"Address: domain {u.strip().rsplit('@', 1)[-1]!r}, extra spaces around it: {u != u.strip()}")
          print(f"App password: {len(p)} characters, spaces inside: {p.strip().count(' ')}, extra spaces around it: {p != p.strip()}")
          PY
      - name: The auth server's recent warnings and errors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, re, urllib.parse, urllib.request
          end = dt.datetime.now(dt.timezone.utc)
          start = end - dt.timedelta(hours=2)
          sql = "select timestamp, event_message from auth_logs order by timestamp desc limit 300"
          q = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": start.strftime("%Y-%m-%dT%H:%M:%SZ"), "iso_timestamp_end": end.strftime("%Y-%m-%dT%H:%M:%SZ")})
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/analytics/endpoints/logs?{q}",
                                       headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"]})
          try:
              body = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print(f"Logs API answered {e.code}: {e.read()[:300]!r}")
              raise SystemExit(0)
          rows = body.get("result") or []
          print(f"{len(rows)} auth log lines in the last 2 hours; error: {body.get('error')}")
          keep = ("level", "path", "method", "status", "msg", "error", "component", "duration")
          for r in rows:
              try:
                  m = json.loads(r["event_message"])
              except Exception:
                  m = {"msg": r["event_message"]}
              text = json.dumps(m).lower()
              if m.get("level") in ("error", "warning", "warn") or "mail" in text or "smtp" in text or "recover" in text:
                  shown = {k: m[k] for k in keep if k in m}
                  line = re.sub(r"[\w.+-]+@[\w-]+\.[\w.]+", "<address>", json.dumps(shown))
                  line = re.sub(r"\b\d{1,3}(\.\d{1,3}){3}\b", "<ip>", line)
                  ts = dt.datetime.fromtimestamp(int(r["timestamp"]) / 1e6, dt.timezone.utc).strftime("%H:%M:%S") if str(r.get("timestamp", "")).isdigit() else r.get("timestamp")
                  print(ts, line[:600])
          PY
