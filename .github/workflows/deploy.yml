# Deploys on every push to main: tests first, then the database, functions and
# settings to Supabase, then the site to GitHub Pages (and Cloudflare Pages, for the
# site's own address, once that's set up: SETUP.md step 10).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_PROJECT_REF, SUPABASE_URL, SUPABASE_ANON_KEY, SITE_URL, CLOUDFLARE_ACCOUNT_ID
# Repository secrets (same page, Secrets tab):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, ODDS_API_KEY, CRON_SECRET,
#   SMTP_USER, SMTP_PASS, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, CLOUDFLARE_API_TOKEN
# SMTP, Google and Cloudflare are optional on the first deploy: whichever isn't set yet is
# left off, and turns on the first deploy after its settings are added. SMTP_USER is
# the site's Yahoo or Gmail address and SMTP_PASS that mailbox's app password.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  supabase:
    needs: test
    # This code is the multi-league site. It must never deploy from the single-league
    # site's repository, whose settings point at that league's live project. Until the
    # repo has its Supabase settings (SETUP.md step 4), the deploy waits and only the tests run.
    if: github.repository != 'SharpSlate/BettingLeague' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the non-secret settings are job-wide. Each secret goes to the steps that
    # use it, so no other step (the CLI setup action included) ever sees it.
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Supabase CLI, pinned by version from npm rather than installed by a
      # third-party action on a movable tag, since the later steps hand it the secrets.
      - name: Install the Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase-cli" --no-audit --no-fund supabase@2.118.0
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the required settings
        env:
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY != '' }}
          HAS_CRON_SECRET: ${{ secrets.CRON_SECRET != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY != '' }}
        run: |
          missing=""
          for v in PROJECT_REF SUPABASE_URL SITE_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD ODDS_API_KEY CRON_SECRET SUPABASE_ANON_KEY; do
            h="HAS_$v"
            [ "${!h}" = "true" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing settings:$missing (see SETUP.md)"; exit 1; fi
      - name: Leave off sign-in options that aren't set up yet
        env:
          HAS_SMTP: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASS != '' }}
          HAS_GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != '' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          if [ "$HAS_SMTP" != "true" ]; then
            echo "::warning::No site email yet: password-reset emails only reach the Supabase project's own members, with a link instead of a code."
            # On the free plan, Supabase's own sender keeps its standard email (a reset
            # link) and its fixed hourly cap: only a custom sender's template and limit can
            # be changed. So the code email and the email_sent limit are left off too, and
            # the site asks for a link instead of a code (VITE_EMAIL_CODES below).
            python3 - <<'PY'
          import re
          p = "supabase/config.toml"
          s = open(p).read()
          s = re.sub(r"(\[auth\.email\.smtp\]\nenabled = )true", r"\1false", s)
          s = re.sub(r"(?m)^email_sent = .*\n", "", s)
          s, n = re.subn(r"\[auth\.email\.template\.recovery\]\nsubject = .*\ncontent_path = .*\n", "", s)
          assert n == 1, "the recovery template section wasn't found"
          open(p, "w").write(s)
          PY
          else
            # config.toml has Yahoo's mail server. A Gmail address sends through Gmail's.
            python3 - <<'PY'
          import os, re
          p = "supabase/config.toml"
          s = open(p).read()
          domain = os.environ["SMTP_USER"].strip().rsplit("@", 1)[-1].lower()
          servers = {"yahoo.com": None, "ymail.com": None, "gmail.com": ("smtp.gmail.com", 587), "googlemail.com": ("smtp.gmail.com", 587)}
          if domain not in servers:
              print("::error::SMTP_USER should be the site's Yahoo or Gmail address. For another mailbox, put its mail server in supabase/config.toml and here.")
              raise SystemExit(1)
          if servers[domain]:
              host, port = servers[domain]
              s, n = re.subn(r"(\[auth\.email\.smtp\]\nenabled = true\n)host = .*\nport = .*\n", rf'\g<1>host = "{host}"\nport = {port}\n', s)
              assert n == 1, "the smtp section wasn't found"
              open(p, "w").write(s)
          print("Site email sends through " + (servers[domain] or ("smtp.mail.yahoo.com",))[0])
          PY
          fi
          if [ "$HAS_GOOGLE" != "true" ]; then
            echo "::warning::No Google sign-in client yet: the site hides the Google button until there is one."
            python3 - <<'PY'
          import re
          p = "supabase/config.toml"
          s = open(p).read()
          s = re.sub(r"(\[auth\.external\.google\]\nenabled = )true", r"\1false", s)
          open(p, "w").write(s)
          PY
          fi
          # The functions accept calls from the site's address and from the repo's GitHub
          # Pages copy, which sends visitors on to the site's address once it has its own.
          echo "SITE_ORIGIN=$(echo "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#'),https://sharpslate.github.io" >> "$GITHUB_ENV"
      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # db push also writes the Vault secrets the schedule reads (project_url and
      # cron_secret, from config.toml's [db.vault]) before it applies migrations.
      - name: Apply database migrations (and Vault secrets for the schedule)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Apply auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: supabase config push --project-ref "$PROJECT_REF" --yes
      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          args=("ODDS_API_KEY=$ODDS_API_KEY" "CRON_SECRET=$CRON_SECRET" "SITE_ORIGIN=$SITE_ORIGIN" "SITE_URL=$SITE_URL")
          # The league's Gmail, for an admin's email to the league (email-league). Optional,
          # like the sign-in codes that use the same account.
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            args+=("SMTP_USER=$SMTP_USER" "SMTP_PASS=$SMTP_PASS")
          fi
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

  pages:
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # "true" once the Cloudflare settings are added (SETUP.md step 10).
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # "true" once the Google sign-in secrets are set; the Google button shows only then.
          VITE_GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != '' }}
          # "true" once the site's own email sender is set: its password-reset email carries a
          # 6-digit code. Until then Supabase's standard email carries a link.
          VITE_EMAIL_CODES: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASS != '' }}
          # The site's address. A copy opened anywhere else sends the visitor there.
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
      # The site's own address (leagues.sharpslatesports.com) is served by Cloudflare Pages:
      # sharpslatesports.com is verified on GitHub for the owner's personal account, which
      # keeps GitHub Pages from serving its subdomains from this organization's repo.
      # Wrangler is pinned by version, like the Supabase CLI, since it's handed a token.
      - name: Publish to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund wrangler@4.147.0
          wrangler="$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler"
          # The first publish creates the project; later ones find it.
          "$wrangler" pages project list | grep -qw sharpslate-leagues \
            || "$wrangler" pages project create sharpslate-leagues --production-branch main
          "$wrangler" pages deploy web/dist --project-name sharpslate-leagues --branch main --commit-dirty=true

  # Checks the live site from outside once it's published: the page and its bundle,
  # the sign-in settings, every function and the database functions are all there.
  check:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Check the live site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A first publish can take a minute to show up.
          for i in $(seq 1 18); do
            code=$(curl -s -o site.html -w "%{http_code}" "$SITE_URL") || code=000
            [ "$code" = "200" ] && grep -q "Betting League" site.html && break
            sleep 10
          done
          [ "$code" = "200" ] || fail "The site answered $code at $SITE_URL"
          grep -q "Betting League" site.html || fail "The page at $SITE_URL isn't this site"
          js=$(grep -o 'assets/[^"]*\.js' site.html | head -1)
          curl -sf -o app.js "${SITE_URL%/}/$js" || fail "The site's script $js didn't load"
          grep -q "$SUPABASE_URL" app.js || fail "The site's script doesn't point at $SUPABASE_URL"
          echo "Site: $SITE_URL is up and points at $SUPABASE_URL"

          curl -sf "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY" -o auth.json || fail "Supabase sign-in settings didn't answer"
          python3 - <<'PY' || exit 1
          import json
          s = json.load(open("auth.json"))
          ext = s.get("external", {})
          print(f"Sign-in: sign-ups {'closed' if s.get('disable_signup') else 'open'}, email {ext.get('email')}, Google {ext.get('google')}, email confirmation {'off' if s.get('mailer_autoconfirm') else 'on'}")
          if s.get("disable_signup") or not ext.get("email"):
              print("::error::Sign-ups or email sign-in are off")
              raise SystemExit(1)
          # The site signs new accounts straight in; with confirmation on they'd be stuck.
          if not s.get("mailer_autoconfirm"):
              print("::error::New accounts have to confirm their email first (enable_confirmations in config.toml)")
              raise SystemExit(1)
          PY

          for f in pull-lines pull-scores place-slip publish-rules add-member import-props; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/$f" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
            echo "Function $f answered $code without signing in"
            case "$code" in 404|000|5*) fail "Function $f isn't working ($code)";; esac
          done

          # The lines job, called as the schedule calls it, answers and says what it did. While
          # the odds feed is off (SETUP.md step 7) it skips without calling the Odds API.
          code=$(curl -s -o lines.json -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/pull-lines" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "Lines job, as the schedule, answered $code: $(head -c 200 lines.json)"
          [ "$code" = "200" ] || fail "The lines job isn't working ($code)"

          # Signed out, this is refused; a 404 would mean the migrations didn't apply.
          code=$(curl -s -o rpc.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/league_by_invite" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{"p_code":"ZZZZZZZZZZ"}')
          echo "Database function league_by_invite answered $code: $(head -c 200 rpc.json)"
          [ "$code" = "404" ] && fail "The database functions aren't there (did the migrations apply?)"
          echo "All checks passed"
