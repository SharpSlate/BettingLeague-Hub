# One-off check that the live pages carry Cloudflare's visitor counter. Reads only the
# public pages: no secrets, no database. Runs only on this side branch.
name: Traffic check

on:
  push:
    branches: [claude/project-thread-m8bf3e]

permissions:
  contents: read

jobs:
  beacon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the visitor counter on the pages?
        run: |
          for u in https://leagues.sharpslatesports.com/ https://leagues.sharpslatesports.com/demo/ https://sharpslate.github.io/BettingLeague-Hub/; do
            code=$(curl -sL --max-time 20 -o page.html -w "%{http_code}" "$u" || echo 000)
            if grep -qi "static.cloudflareinsights.com/beacon" page.html; then
              echo "$u ($code): Cloudflare Web Analytics beacon found"
            else
              echo "$u ($code): no Cloudflare Web Analytics beacon in the page"
            fi
          done
          # Anything in the site's headers that could stop the beacon from loading or reporting.
          curl -sI --max-time 20 https://leagues.sharpslatesports.com/ | grep -iE "^(content-security-policy|cf-cache-status|server):" || true
