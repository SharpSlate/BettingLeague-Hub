# Supabase project settings, applied to the hosted project by the deploy workflow
# (supabase config push). Secrets come from environment variables via env(); the
# workflow supplies them from GitHub Secrets. Nothing secret belongs in this file.

project_id = "betting-league"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

# Read by the pg_cron jobs (see the schedule migration); supabase db push stores them in Vault.
[db.vault]
project_url = "env(SUPABASE_URL)"
cron_secret = "env(CRON_SECRET)"

[auth]
enabled = true
site_url = "env(SITE_URL)"
# The repo's GitHub Pages address stays allowed after the site moves to its own address
# (SETUP.md step 10), since that copy sends its visitors on to SITE_URL.
additional_redirect_urls = ["env(SITE_URL)", "https://sharpslate.github.io/BettingLeague-Hub/"]
jwt_expiry = 3600
# Sign-ups are open: anyone can make an account with an email and password (or Google),
# then start a league or join one with its invite link.
enable_signup = true
enable_anonymous_sign_ins = false
# The site asks for the same (MIN_PASSWORD in web/src/lib/auth.ts).
minimum_password_length = 8

[auth.email]
# Must stay true: in config push this switch turns the whole email and password sign-in
# method on or off.
enable_signup = true
# New accounts aren't asked to confirm their email, so signing up sends nothing. Whoever
# owns an address can always take its account back with a password reset.
enable_confirmations = false
double_confirm_changes = true
# Members sign in with a password. Email goes out only for a forgotten one: a 6-digit
# code (no link, so it works on phones).
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.rate_limit]
# Password-reset emails per hour. Supabase's default is very low; launch day needs headroom.
email_sent = 100

[auth.email.template.recovery]
subject = "Reset your Betting League password"
content_path = "./supabase/templates/reset-code.html"

# The site's own mailbox, with an app password. Supabase's built-in sender only reaches
# the project's own team, so members need this to get reset codes. Host and port are
# Yahoo's; the deploy switches them to Gmail's when SMTP_USER is a Gmail address.
[auth.email.smtp]
enabled = true
host = "smtp.mail.yahoo.com"
port = 465
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_USER)"
sender_name = "Betting League"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Every function checks its caller itself: members and admins through the Auth server
# (auth.getUser), and pg_cron through the shared cron secret. The platform's own JWT
# check only understands Supabase's legacy keys, so it's off; new projects use the
# newer signing keys by default.
[functions.pull-lines]
verify_jwt = false

[functions.pull-scores]
verify_jwt = false

[functions.place-slip]
verify_jwt = false

[functions.publish-rules]
verify_jwt = false

[functions.add-member]
verify_jwt = false

[functions.import-props]
verify_jwt = false

[functions.import-boxes]
verify_jwt = false

[functions.email-league]
verify_jwt = false
